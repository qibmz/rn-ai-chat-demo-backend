name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from package.json#packageManager

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              pnpm exec commitlint --from HEAD~1 --to HEAD --verbose || pnpm exec commitlint --last --verbose
            else
              pnpm exec commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
            fi
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nest_starter
          POSTGRES_PASSWORD: nest_starter_secret
          POSTGRES_DB: nest_starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nest_starter -d nest_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nest_starter:nest_starter_secret@localhost:5432/nest_starter?schema=public
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-test-access-secret-unique-9f3a2b!!
      JWT_REFRESH_SECRET: ci-test-refresh-secret-unique-9f3a2b!
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from package.json#packageManager

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Avoid job-level NODE_ENV affecting optional peer resolution
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Prisma migrate
        run: pnpm exec prisma migrate deploy

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck (incl. tests)
        run: pnpm run typecheck:all

      - name: Test with coverage
        run: pnpm run test:cov

      - name: E2E
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build
